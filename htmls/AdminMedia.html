<div class="md-site md-admin" id="md-site" data-theme="light" style="{plhd_style}">
<header class="md-ahead">
    <button type="button" class="md-ibtn md-burger" aria-label="Menu" onclick="AdminMediaJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="md-abrand" href="Admin"><b>SkyLite Post</b><span>Newsroom</span></a>
    <span class="md-demo" id="md-demo"></span>
    <span class="md-grow"></span>
    <a class="md-who" id="md-who" href="AdminAccount"></a>
    <a class="md-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="md-out" onclick="AdminMediaJs.signOut()">Sign out</button>
</header>
<aside class="md-side" id="md-nav" aria-label="Newsroom">
    <div class="md-nav-top"><span>Newsroom</span><button type="button" class="md-ibtn" aria-label="Close" onclick="AdminMediaJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="md-amenu" id="md-menu"></ul>
</aside>
<div class="md-scrim" id="md-scrim" onclick="AdminMediaJs.closeNav()"></div>
<main class="md-amain" id="md-main"><p class="md-loading">Loading&hellip;</p></main>
<div class="md-modal" id="md-modal" onclick="if(event.target===this)AdminMediaJs.closeModal()">
    <div class="md-mbox" role="dialog" aria-modal="true"><button type="button" class="md-ibtn md-mclose" aria-label="Close" onclick="AdminMediaJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="md-mbody"></div></div>
</div>
<div class="md-toast" id="md-toast" role="status" aria-live="polite"></div>
</div>
