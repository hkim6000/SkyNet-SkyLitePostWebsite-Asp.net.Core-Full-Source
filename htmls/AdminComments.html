<div class="cm-site cm-admin" id="cm-site" data-theme="light" style="{plhd_style}">
<header class="cm-ahead">
    <button type="button" class="cm-ibtn cm-burger" aria-label="Menu" onclick="AdminCommentsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="cm-abrand" href="Admin"><b>SkyLite Post</b><span>Newsroom</span></a>
    <span class="cm-demo" id="cm-demo"></span>
