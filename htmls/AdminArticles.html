<div class="ed-site ed-admin" id="ed-site" data-theme="light" style="{plhd_style}">
<header class="ed-ahead">
    <button type="button" class="ed-ibtn ed-burger" aria-label="Menu" onclick="AdminArticlesJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ed-abrand" href="Admin"><b>SkyLite Post</b><span>Newsroom</span></a>
    <span class="ed-demo" id="ed-demo"></span>
    <span class="ed-grow"></span>
    <a class="ed-who" id="ed-who" href="AdminAccount"></a>
    <a class="ed-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ed-out" onclick="AdminArticlesJs.signOut()">Sign out</button>
</header>
<aside class="ed-side" id="ed-nav" aria-label="Newsroom">
    <div class="ed-nav-top"><span>Newsroom</span><button type="button" class="ed-ibtn" aria-label="Close" onclick="AdminArticlesJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="ed-amenu" id="ed-menu"></ul>
</aside>
<div class="ed-scrim" id="ed-scrim" onclick="AdminArticlesJs.closeNav()"></div>
<main class="ed-amain" id="ed-main"><p class="ed-loading">Loading&hellip;</p></main>
<div class="ed-modal" id="ed-modal" onclick="if(event.target===this)AdminArticlesJs.closeModal()">
    <div class="ed-mbox" role="dialog" aria-modal="true"><button type="button" class="ed-ibtn ed-mclose" aria-label="Close" onclick="AdminArticlesJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ed-mbody"></div></div>
</div>
<div class="ed-toast" id="ed-toast" role="status" aria-live="polite"></div>
</div>
