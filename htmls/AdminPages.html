<div class="pg-site pg-admin" id="pg-site" data-theme="light" style="{plhd_style}">
<header class="pg-ahead">
    <button type="button" class="pg-ibtn pg-burger" aria-label="Menu" onclick="AdminPagesJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="pg-abrand" href="Admin"><b>SkyLite Post</b><span>Newsroom</span></a>
    <span class="pg-demo" id="pg-demo"></span>
    <span class="pg-grow"></span>
    <a class="pg-who" id="pg-who" href="AdminAccount"></a>
    <a class="pg-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="pg-out" onclick="AdminPagesJs.signOut()">Sign out</button>
</header>
<aside class="pg-side" id="pg-nav" aria-label="Newsroom">
    <div class="pg-nav-top"><span>Newsroom</span><button type="button" class="pg-ibtn" aria-label="Close" onclick="AdminPagesJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="pg-amenu" id="pg-menu"></ul>
</aside>
<div class="pg-scrim" id="pg-scrim" onclick="AdminPagesJs.closeNav()"></div>
<main class="pg-amain" id="pg-main"><p class="pg-loading">Loading&hellip;</p></main>
<div class="pg-modal" id="pg-modal" onclick="if(event.target===this)AdminPagesJs.closeModal()">
    <div class="pg-mbox" role="dialog" aria-modal="true"><button type="button" class="pg-ibtn pg-mclose" aria-label="Close" onclick="AdminPagesJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="pg-mbody"></div></div>
</div>
<div class="pg-toast" id="pg-toast" role="status" aria-live="polite"></div>
</div>
